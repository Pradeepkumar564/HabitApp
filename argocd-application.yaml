apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: habit-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pradeepkumar564/HabitApp.git
    targetRevision: main
    path: habit-tracker
    helm:
      releaseName: habit-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: habit-tracker
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
